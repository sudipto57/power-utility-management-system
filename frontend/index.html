<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Power Utility Management System - customers, meters, bills and complaints in one place" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <!-- Only the Taka sign (৳) from Noto Sans Bengali: a tiny file, so ৳ looks the same on every computer -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500;600;700;800&text=%E0%A7%B3&display=swap" rel="stylesheet" />
    <title>Power Utility Management System</title>
    <!-- Dark mode: turn it on before the page appears, so there is no white flash (see src/context/ThemeProvider.jsx) -->
    <!-- Security: vercel.json only allows this exact script (its sha256). If you change it, update the hash there. -->
    <script>
      try {
        if (localStorage.getItem('power_utility_theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        /* storage not available: light mode */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
